plugins {
    id 'dotcraft.neoforge-base'
}

// -Pdev.mods=dotcraftresources,dotcraftenergy limits the dev runs to those mods; -Pdev.noCompat drops JEI/Jade/REI
def only = findProperty('dev.mods')?.toString()?.split(',') as List
def allMods = rootProject.subprojects.findAll { it.path.startsWith(':mods:') }
allMods.each { evaluationDependsOn(it.path) }
def modProjects = allMods.findAll { only == null || it.property('mod_id') in only }

dependencies {
    modProjects.each { implementation it }
    if (!project.hasProperty('dev.noCompat')) {
        localRuntime libs.jei
        localRuntime libs.jade
        // localRuntime libs.rei // REI disabled for now
    }
}

neoForge {
    mods {
        modProjects.each { p ->
            "${p.property('mod_id')}" {
                sourceSet p.sourceSets.main
            }
        }
    }
}

neoForge.ideSyncTask rootProject.tasks.named('installGitHooks')
