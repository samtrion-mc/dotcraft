plugins {
    id 'dotcraft.neoforge-mod'
}

dependencies {
    compileOnly project(':mods:resources')
    compileOnly project(':mods:energy')

    compileOnly libs.jade
    localRuntime libs.jade

    // the provider split test loads the Jade providers and the energy classes they read
    testImplementation libs.jade
    testImplementation project(':mods:energy')
}
