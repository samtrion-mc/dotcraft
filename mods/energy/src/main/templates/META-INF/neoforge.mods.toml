license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="samtrion"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dotcraft_resources"
    type="required"
    versionRange="[${mod_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="${jei_version_range}"
    ordering="AFTER"
    side="CLIENT"
    reason="JEI integration"

[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="${jade_version_range}"
    ordering="AFTER"
    side="BOTH"
    reason="Jade integration"

[[dependencies.${mod_id}]]
    modId="roughlyenoughitems"
    type="optional"
    versionRange="${rei_version_range}"
    ordering="AFTER"
    side="CLIENT"
    reason="REI integration"
