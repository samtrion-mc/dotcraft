plugins {
    id 'dotcraft.neoforge-base'
    id 'maven-publish'
}

def modId = project.property('mod_id')

group = project.property('mod_group_id')

base {
    archivesName = "dotcraft-${project.name}"
}

// GameTests live in their own source set so they never ship in the mod jar
sourceSets {
    gametest
}

configurations {
    gametestImplementation.extendsFrom implementation
}

dependencies {
    gametestImplementation sourceSets.main.output
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

neoForge {
    addModdingDependenciesTo sourceSets.gametest
    addModdingDependenciesTo sourceSets.test

    mods {
        "${modId}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }

    runs {
        // ./gradlew runGameTestServer runs the GameTests of this mod headless; fails the build if a required test fails
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }
        // the modules run in parallel; a shared game directory makes them fight over the world's session.lock
        configureEach {
            if (name == 'gameTestServer') gameDirectory = rootProject.file("run/gametest-${modId}")
        }
    }
}

// Datagen output is committed; CI re-runs it and fails on any difference
def generated = file('src/generated/resources')
sourceSets.main.resources.srcDir generated

def datagenArgs = [
        '--mod', modId,
        '--all',
        '--uncached', // the cache of one run would delete the other run's output as stale
        '--output', generated.absolutePath,
        '--existing', file('src/main/resources').absolutePath,
]

neoForge {
    runs {
        // ./gradlew runClientData / runServerData
        clientData {
            clientData()
            systemProperty 'dotcraftresources.datagen', 'true' // the conditions of the sources count as met, so all data is made
            programArguments.addAll(datagenArgs)
        }
        serverData {
            serverData()
            systemProperty 'dotcraftresources.datagen', 'true'
            programArguments.addAll(datagenArgs)
        }
    }
}

// ./gradlew generateData - clean regeneration of everything (drops files of removed blocks)
def cleanGenerated = tasks.register('cleanGenerated', Delete) {
    delete fileTree(generated) // contents only; deleting the directory itself fails on Windows when a shell sits in it
}
// processResources runs before the datagen (the runs need it) and so copies the emptied generated folder; this puts
// the fresh output into the resources the game tests run with, in the same Gradle invocation
def syncGenerated = tasks.register('syncGenerated', Copy) {
    from generated
    into tasks.named('processResources', ProcessResources).map { it.destinationDir }
    mustRunAfter 'runClientData', 'runServerData'
    outputs.upToDateWhen { false } // processResources shares the folder and drops what it does not know
}
// Copy leaves behind what a source no longer has (a removed recipe would stay in the game), so both copies drop the
// data and assets that no resource folder has any more
def resourceDirs = sourceSets.main.resources.srcDirs.toList()
def dropStale = { File dest ->
    dest.eachFileRecurse(groovy.io.FileType.FILES) { file ->
        def rel = dest.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, (char) '/')
        if ((rel.startsWith('data/') || rel.startsWith('assets/')) && !resourceDirs.any { new File(it, rel).exists() }) file.delete()
    }
}
tasks.named('processResources') { doFirst { dropStale(destinationDir) } }
syncGenerated.configure { doFirst { dropStale(destinationDir) } }
tasks.register('generateData') {
    group = 'dotcraft'
    description = 'Regenerates src/generated/resources from scratch'
    dependsOn cleanGenerated, 'runClientData', 'runServerData', syncGenerated
}
tasks.named('runGameTestServer') { mustRunAfter syncGenerated }
tasks.named('compileTestJava') { mustRunAfter syncGenerated } // the tests read the synced resources
// Strips whitespace outside of strings; unlike a parse/serialize round trip it keeps every character (e.g. umlauts) as is
class MinifyJsonReader extends FilterReader {
    MinifyJsonReader(Reader source) {
        super(new StringReader(minify(source.text)))
    }

    static String minify(String json) {
        def out = new StringBuilder(json.length())
        boolean inString = false, escaped = false
        for (char c : json.toCharArray()) {
            if (inString) {
                out.append(c)
                if (escaped) escaped = false
                else if (c == (char) '\\') escaped = true
                else if (c == (char) '"') inString = false
            } else if (!Character.isWhitespace(c)) {
                out.append(c)
                inString = c == (char) '"'
            }
        }
        return out.toString()
    }
}

tasks.named('jar', Jar) {
    mustRunAfter syncGenerated // other mods run with this jar and need the synced data
    // only the shipped jar is minified; the unpacked resources stay readable for runs and game tests
    filteringCharset = 'UTF-8'
    filesMatching(['**/*.json', '**/*.mcmeta']) { filter(MinifyJsonReader) }
}
tasks.named('runClientData') { mustRunAfter cleanGenerated }
tasks.named('runServerData') { mustRunAfter 'runClientData' }
tasks.named('processResources') { mustRunAfter cleanGenerated }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : project.property('minecraft_version'),
            minecraft_version_range: project.property('minecraft_version_range'),
            neo_version            : project.property('neo_version'),
            mod_id                 : modId,
            mod_name               : project.property('mod_name'),
            mod_description        : project.property('mod_description'),
            mod_license            : project.property('mod_license'),
            mod_version            : project.version.toString(),
    ]
    // only the standalone compat mods (jei/jade/rei) set this in their own gradle.properties: version range of the third-party mod
    def compatRange = findProperty('compat_version_range')
    if (compatRange != null) replaceProperties.compat_version_range = compatRange.toString()
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = "dotcraft-${project.name}"
            from components.java
        }
    }
    repositories {
    }
}
