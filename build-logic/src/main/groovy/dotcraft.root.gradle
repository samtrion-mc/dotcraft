import javax.inject.Inject
import org.gradle.process.ExecOperations
import org.gradle.api.DefaultTask
import org.gradle.api.GradleException
import org.gradle.api.provider.ListProperty
import org.gradle.api.provider.Property
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.Internal
import org.gradle.api.tasks.TaskAction
import org.gradle.api.tasks.options.Option

abstract class NewModTask extends DefaultTask {
    @Input @Option(option = 'id', description = 'Mod directory/id, e.g. magic or my-mod')
    abstract Property<String> getModId()

    @Input @Option(option = 'name', description = 'Display name, e.g. "Magic"')
    abstract Property<String> getModName()

    @Input @Option(option = 'depends', description = 'Comma separated sibling mods, e.g. resources,energy')
    abstract Property<String> getDepends()

    @Input @Option(option = 'no-compat', description = 'Skip the JEI/Jade/REI compat skeleton')
    abstract Property<Boolean> getNoCompat()

    @Internal
    abstract DirectoryProperty getRootDir()

    NewModTask() {
        depends.convention('')
        noCompat.convention(false)
    }

    @TaskAction
    void run() {
        def id = modId.get()
        if (!(id ==~ /[a-z][a-z0-9]*(-[a-z0-9]+)*/)) throw new GradleException("--id must be lowercase letters, digits and dashes: '$id'")
        def root = rootDir.get().asFile
        def dir = new File(root, "mods/$id")
        if (dir.exists()) throw new GradleException("$dir already exists")
        def deps = depends.get().split(',').collect { it.trim() }.findAll { it }
        deps.each { if (!new File(root, "mods/$it/build.gradle").exists()) throw new GradleException("unknown dependency mod '$it'") }
        def compat = !noCompat.get()

        def pkg = "net.samtrion.dotcraft.${id.replace('-', '')}"
        def cls = id.split('-').collect { it.capitalize() }.join('') + 'Mod'
        def fullId = "dotcraft_${id.replace('-', '_')}"
        def pkgDir = new File(dir, "src/main/java/${pkg.replace('.', '/')}")

        def write = { File f, String text -> f.parentFile.mkdirs(); f.text = text.stripIndent().stripLeading() }

        // build.gradle
        def gradleDeps = deps.collect { "    implementation project(':mods:$it')" }
        if (compat) gradleDeps += ['', '    compileOnly libs.jei.api', '    compileOnly libs.jade', '    compileOnly libs.rei.api',
                                   '    localRuntime libs.jei', '    localRuntime libs.jade', '    localRuntime libs.rei']
        write(new File(dir, 'build.gradle'), "plugins {\n    id 'dotcraft.neoforge-mod'\n}\n" +
                (gradleDeps ? "\ndependencies {\n${gradleDeps.join('\n')}\n}\n" : ''))

        write(new File(dir, 'gradle.properties'),
                "mod_id=$fullId\nmod_name=.Craft: ${modName.get()}\nmod_description=${modName.get()} for the .Craft mods.\n")

        // mod class
        def imports = ['net.neoforged.bus.api.IEventBus', 'net.neoforged.fml.ModContainer', 'net.neoforged.fml.ModList',
                       'net.neoforged.fml.common.Mod', 'com.mojang.logging.LogUtils', 'org.slf4j.Logger']
        if (compat) imports += ["${pkg}.compat.jade.JadeCompat", "${pkg}.compat.jei.JeiCompat", "${pkg}.compat.rei.ReiCompat"]
        def compatCalls = compat ? '''
                    if (ModList.get().isLoaded("jei")) JeiCompat.init();
                    if (ModList.get().isLoaded("jade")) JadeCompat.init();
                    if (ModList.get().isLoaded("roughlyenoughitems")) ReiCompat.init();''' : ''
        write(new File(pkgDir, "${cls}.java"), """\
            package $pkg;

            ${imports.sort().collect { "import $it;" }.join('\n            ')}

            /**
             * Entry point of the {@code .Craft: ${modName.get()}} mod.
             */
            @Mod(${cls}.MODID)
            public class $cls {
                /** Mod id of this mod. */
                public static final String MODID = "$fullId";

                /** Logger of this mod. */
                public static final Logger LOGGER = LogUtils.getLogger();

                /**
                 * Constructs the mod; invoked by NeoForge on load.
                 *
                 * @param modEventBus  the mod-specific event bus
                 * @param modContainer the container of this mod
                 */
                public $cls(IEventBus modEventBus, ModContainer modContainer) {
                    LOGGER.info("{} loaded", MODID);$compatCalls
                }
            }
            """)

        if (compat) {
            [jei: 'JEI', jade: 'Jade', rei: 'REI'].each { sub, label ->
                def c = "${sub.capitalize()}Compat"
                write(new File(pkgDir, "compat/$sub/${c}.java"), """\
                    package ${pkg}.compat.$sub;

                    import ${pkg}.$cls;

                    /**
                     * Bootstrap for the optional $label integration.
                     * <p>
                     * Only call {@link #init()} when $label is loaded.
                     */
                    public final class $c {
                        private $c() {}

                        /** Initializes the $label integration. */
                        public static void init() {
                            ${cls}.LOGGER.info("$label integration enabled");
                        }
                    }
                    """)
            }
        }

        // tests
        def testDir = new File(dir, "src/test/java/${pkg.replace('.', '/')}")
        write(new File(testDir, "${cls}Test.java"), """\
            package $pkg;

            import static org.junit.jupiter.api.Assertions.assertTrue;

            import org.junit.jupiter.api.Test;

            /** Unit tests for {@link $cls}. */
            class ${cls}Test {
                /** The mod id must follow the {@code dotcraft_<name>} convention used by the scaffold. */
                @Test
                void modIdFollowsConvention() {
                    assertTrue(${cls}.MODID.matches("dotcraft_[a-z0-9_]+"), ${cls}.MODID);
                }
            }
            """)

        def gameTestDir = new File(dir, "src/gametest/java/${pkg.replace('.', '/')}")
        write(new File(gameTestDir, "${cls}GameTests.java"), """\
            package $pkg;

            import java.util.function.Consumer;

            import net.minecraft.core.registries.Registries;
            import net.minecraft.gametest.framework.FunctionGameTestInstance;
            import net.minecraft.gametest.framework.GameTestHelper;
            import net.minecraft.gametest.framework.TestData;
            import net.minecraft.gametest.framework.TestEnvironmentDefinition;
            import net.minecraft.resources.Identifier;
            import net.minecraft.resources.ResourceKey;
            import net.neoforged.bus.api.SubscribeEvent;
            import net.neoforged.fml.ModList;
            import net.neoforged.fml.common.EventBusSubscriber;
            import net.neoforged.neoforge.event.RegisterGameTestsEvent;
            import net.neoforged.neoforge.registries.RegisterEvent;

            /**
             * GameTests of the {@code .Craft: ${modName.get()}} mod, run with {@code ./gradlew :mods:$id:runGameTestServer}.
             */
            @EventBusSubscriber(modid = ${cls}.MODID)
            public final class ${cls}GameTests {
                private static final Identifier MOD_LOADED = Identifier.fromNamespaceAndPath(${cls}.MODID, "mod_loaded");
                private static final ResourceKey<Consumer<GameTestHelper>> MOD_LOADED_FUNCTION =
                        ResourceKey.create(Registries.TEST_FUNCTION, MOD_LOADED);

                private ${cls}GameTests() {}

                /**
                 * Registers the test functions.
                 *
                 * @param event the registry event
                 */
                @SubscribeEvent
                static void registerFunctions(RegisterEvent event) {
                    event.register(Registries.TEST_FUNCTION, registry ->
                            registry.register(MOD_LOADED, (Consumer<GameTestHelper>) ${cls}GameTests::modLoaded));
                }

                /**
                 * Registers the test instances.
                 *
                 * @param event the game test registration event
                 */
                @SubscribeEvent
                static void registerTests(RegisterGameTestsEvent event) {
                    var environment = event.registerEnvironment(MOD_LOADED, new TestEnvironmentDefinition.AllOf());
                    event.registerTest(MOD_LOADED, new FunctionGameTestInstance(MOD_LOADED_FUNCTION,
                            new TestData<>(environment, Identifier.withDefaultNamespace("empty"), 20, 0, true)));
                }

                /**
                 * The mod must be loaded in the test server.
                 *
                 * @param helper the game test helper
                 */
                private static void modLoaded(GameTestHelper helper) {
                    helper.assertTrue(ModList.get().isLoaded(${cls}.MODID), ${cls}.MODID + " is not loaded");
                    helper.succeed();
                }
            }
            """)

        // toml
        def dep = { String mid, String type, String range, String order, String side, String reason = null ->
            "\n[[dependencies.\${mod_id}]]\n    modId=\"$mid\"\n    type=\"$type\"\n    versionRange=\"$range\"\n    ordering=\"$order\"\n    side=\"$side\"\n" +
                    (reason ? "    reason=\"$reason\"\n" : '')
        }
        def toml = '''\
            license="${mod_license}"

            [[mods]]
            modId="${mod_id}"
            version="${mod_version}"
            displayName="${mod_name}"
            authors="samtrion"
            description=\'\'\'${mod_description}\'\'\'
            '''.stripIndent() +
                dep('neoforge', 'required', '[${neo_version},)', 'NONE', 'BOTH') +
                dep('minecraft', 'required', '${minecraft_version_range}', 'NONE', 'BOTH') +
                deps.collect { dep("dotcraft_${it.replace('-', '_')}", 'required', '[${mod_version},)', 'AFTER', 'BOTH') }.join('') +
                (compat ? dep('jei', 'optional', '${jei_version_range}', 'AFTER', 'CLIENT', 'JEI integration') +
                        dep('jade', 'optional', '${jade_version_range}', 'AFTER', 'BOTH', 'Jade integration') +
                        dep('roughlyenoughitems', 'optional', '${rei_version_range}', 'AFTER', 'CLIENT', 'REI integration') : '')
        def tomlFile = new File(dir, 'src/main/templates/META-INF/neoforge.mods.toml')
        tomlFile.parentFile.mkdirs()
        tomlFile.text = toml
        logger.lifecycle("Created mods/$id (mod id $fullId). Re-sync Gradle to pick it up.")
    }
}

tasks.register('newMod', NewModTask) {
    group = 'dotcraft'
    description = 'Scaffolds mods/<id>: --id=magic --name="Magic" [--depends=resources,energy] [--no-compat]'
    rootDir = rootProject.layout.projectDirectory
}

abstract class InstallGitHooksTask extends DefaultTask {
    @Inject abstract ExecOperations getExec()

    @TaskAction
    void run() {
        exec.exec { commandLine 'git', 'config', 'core.hooksPath', '.githooks' }
    }
}

tasks.register('installGitHooks', InstallGitHooksTask) {
    group = 'dotcraft'
    description = 'Points git at .githooks (conventional commit check)'
    outputs.upToDateWhen { false }
}
