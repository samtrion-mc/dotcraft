org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# file-system watching misses files written by the datagen child process, which left processResources stale
org.gradle.vfs.watch=false

java_version=25
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.124

mod_group_id=net.samtrion.dotcraft
mod_license=MIT

# optional compat dependency ranges (used in neoforge.mods.toml of mods that integrate them)
jei_version_range=[29,)
jade_version_range=[26.1,)
rei_version_range=[26.1,)
