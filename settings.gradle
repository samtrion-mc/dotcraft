pluginManagement {
    includeBuild 'build-logic'
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'dotcraft'

file('mods').with { dir ->
    if (dir.isDirectory()) {
        dir.eachDir { if (new File(it, 'build.gradle').exists()) include ":mods:${it.name}" }
    }
}
